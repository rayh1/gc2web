[project]
name = "gc2web"
version = "0.1.0"
description = "Generate a static genealogy website from a GEDCOM file."
requires-python = ">=3.14"
dependencies = [
    "tqdm>=4.67.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "jsonschema>=4.25.1",
    "ruff",
    "pytest",
    "gedq",
    "mypy",
    "types-PyYAML",
    "types-tqdm",
]

[tool.uv.sources]
# gen_site runs the gedq CLI; the wheel is vendored.
gedq = { path = "vendor/gedq-2.3.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["gen_site/test"]
pythonpath = ["gen_site"]

[tool.mypy]
strict = true
# gen_site/ is the import root (no __init__.py files); its test/ folder stays out.
files = ["gen_site"]
exclude = ["^gen_site/test/"]
mypy_path = "gen_site"
explicit_package_bases = true

[tool.uv]
# gen_site is run as a script, not installed as a package — manage the env only.
package = false

[tool.ruff.lint]
# EXE002 (executable file without a shebang) fires because every file on the Windows share reads as
# executable; git stores them as mode 100644, so it is not a code problem.
ignore = ["EXE002"]
